# Deploy to WP.org
name: Deploy to WordPress.org

# Deploys when a GitHub release is published.
on:
  release:
    types: [published]

permissions:
  contents: read

# Never run two SVN deploys at once; queue instead of cancelling mid-commit.
concurrency:
  group: deploy-wporg
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The 10up action publishes the tag name (minus a leading "v") as the SVN
      # tag, so all version sources must agree before anything is built.
      - name: Verify tag matches plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -E '^[[:space:]*]*Version:' infobox.php | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]+$//')
          readme=$(grep -m1 -iE '^Stable tag:' readme.txt | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]+$//')
          constant=$(grep -m1 -E "define\([[:space:]]*['\"]INFOBOX_VERSION['\"]" infobox.php | sed -E "s/.*,[[:space:]]*['\"]([^'\"]+)['\"].*/\1/")

          fail=0
          check() {
            if [ "$3" = "$tag" ]; then
              echo "$1: $3"
            else
              echo "::error file=$2::$1 is '$3' but the tag is '$tag'"
              fail=1
            fi
          }
          check "Version header" infobox.php "$header"
          check "Stable tag" readme.txt "$readme"
          check INFOBOX_VERSION infobox.php "$constant"
          exit $fail

      # The controls and style-handler submodules are private repos, which
      # GITHUB_TOKEN can't read. CONTROLS_PAT is a fine-grained PAT limited to
      # EssentialBlocks/controls and EssentialBlocks/style-handler with
      # Contents: read-only.
      - name: Resolve submodule commits
        id: submodules
        run: |
          echo "controls=$(git rev-parse HEAD:controls)" >> "$GITHUB_OUTPUT"
          echo "style_handler=$(git rev-parse HEAD:lib/style-handler)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: EssentialBlocks/controls
          ref: ${{ steps.submodules.outputs.controls }}
          path: controls
          token: ${{ secrets.CONTROLS_PAT }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: EssentialBlocks/style-handler
          ref: ${{ steps.submodules.outputs.style_handler }}
          path: lib/style-handler
          token: ${{ secrets.CONTROLS_PAT }}
          persist-credentials: false

      # Node version. Keep in sync with .nvmrc and package.json engines.
      #
      # Must stay >= 20.19. Two independent floors require it:
      #
      #   1. webpack >= 5.108.0 emits a literal `Object.hasOwn(...)` into
      #      generated runtime code, because wp-scripts builds with
      #      `target: 'browserslist'` and every browser in the WordPress
      #      browserslist supports it. mini-css-extract-plugin then EXECUTES
      #      that generated module in the build process, so the build host
      #      needs it too. `Object.hasOwn` landed in Node 16.9.0, so Node 14
      #      failed here with:
      #        Error: Execution of module code from module graph failed:
      #        Object.hasOwn is not a function
      #   2. The locked sass release declares `engines.node >= 20.19.0`.
      #
      # Note: the `controls` submodule still needs npm 6 to install, but CI
      # never builds it - this job runs only the root build, whose webpack
      # entry is ./src/index.js and which does not import controls. That
      # constraint applies to local controls builds only, not to this job.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Running NPM Install & Build
        run: |
          npm ci
          npm run build

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
