# Deploy to WP.org
name: Deploy to WordPress.org

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    tags:
    - "*"
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
            submodules: recursive
            token: ${{ secrets.EB_PAT }}
      # Node version. Keep in sync with .nvmrc and package.json engines.
      #
      # Must stay >= 20.19. Two independent floors require it:
      #
      #   1. webpack >= 5.108.0 emits a literal `Object.hasOwn(...)` into
      #      generated runtime code, because wp-scripts builds with
      #      `target: 'browserslist'` and every browser in the WordPress
      #      browserslist supports it. mini-css-extract-plugin then EXECUTES
      #      that generated module in the build process, so the build host
      #      needs it too. `Object.hasOwn` landed in Node 16.9.0, so Node 14
      #      failed here with:
      #        Error: Execution of module code from module graph failed:
      #        Object.hasOwn is not a function
      #   2. The locked sass release declares `engines.node >= 20.19.0`.
      #
      # Note: the `controls` submodule still needs npm 6 to install, but CI
      # never builds it - this job runs only the root build, whose webpack
      # entry is ./src/index.js and which does not import controls. That
      # constraint applies to local controls builds only, not to this job.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Runs a single command using the runners shell
      # - name: Git Submodule Cloning
      #   run: git submodule update --init --recursive
        # env:
        #   GITHUB_TOKEN: ${{ secrets.TOKEN }}
      - name: Running NPM Install & Build
        run: |
          npm ci
          npm run build
      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
